[workspace]
members = [
  "crates/rune-core",
  "crates/rune-native",
  "crates/rune-bench",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/eunhhu/rune"
authors = ["Sunwoo Moon"]
rust-version = "1.81"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
