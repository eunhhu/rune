name: Export source snapshot for conflict resolution

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .git
          tar -czf /tmp/source-snapshot.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: main-source-snapshot
          path: /tmp/source-snapshot.tar.gz
          retention-days: 1
