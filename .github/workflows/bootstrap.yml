name: Materialize Spellwire source tree

on:
  push:
    branches: ["feat/spellwire-rebrand"]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: spellwire-rebrand-materialize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand and rebrand verified source tree
        run: |
          python3 .bootstrap/unpack.py
          sed -i 's/toBe("RUNE")/toBe("SPWR")/' packages/spellwire/test/encode.test.ts

      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify Spellwire workspace
        run: |
          set -euo pipefail
          bun install
          bun run typecheck
          bun run test:ts
          bun run compile:example
          cargo test --workspace
          cargo build -p spellwire-native --release
          bun run pack:dry-run

      - name: Commit clean source to the feature branch
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          rm -f .github/workflows/bootstrap.yml
          rm -f examples/*.spellwire.bin examples/*.spellwire.bin.json
          rm -rf packages/*/dist target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: rebrand runtime and packages to Spellwire"
          git push origin HEAD:feat/spellwire-rebrand

      - name: Pack reviewed source
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          rm -rf .git .bootstrap packages/*/dist target
          rm -f .github/workflows/bootstrap.yml
          rm -f examples/*.spellwire.bin examples/*.spellwire.bin.json
          tar -czf /tmp/spellwire-source.tar.gz .

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: spellwire-source
          path: /tmp/spellwire-source.tar.gz
          if-no-files-found: error
          retention-days: 1
