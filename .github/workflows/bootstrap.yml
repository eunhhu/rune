name: Materialize source for Spellwire rebrand

on:
  push:
    branches: ["feat/spellwire-rebrand"]
    paths:
      - ".github/workflows/bootstrap.yml"
      - ".bootstrap/**"

permissions:
  contents: write

concurrency:
  group: spellwire-rebrand-materialize
  cancel-in-progress: true

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand verified source tree
        run: python3 .bootstrap/unpack.py

      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify materialized source
        run: |
          set -euo pipefail
          bun install
          bun run typecheck
          bun run test:ts
          bun run compile:example
          cargo test --workspace
          cargo build -p rune-native --release

      - name: Commit materialized source to rebrand branch
        run: |
          set -euo pipefail
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: materialize verified runtime source"
          git push origin HEAD:feat/spellwire-rebrand
