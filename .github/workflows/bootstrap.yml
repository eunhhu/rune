name: Bootstrap initial runtime

on:
  push:
    branches:
      - feat/initial-runtime
    paths:
      - .bootstrap/ready

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand verified source tree
        run: python3 .bootstrap/unpack.py

      - name: Commit source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add native realtime macro runtime"
          git push
