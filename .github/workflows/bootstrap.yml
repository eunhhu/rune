name: Materialize source for Spellwire rebrand

on:
  push:
    branches: ["feat/spellwire-rebrand"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: spellwire-rebrand-materialize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand verified source tree
        run: python3 .bootstrap/unpack.py

      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify materialized source
        run: |
          set -euo pipefail
          bun install
          bun run typecheck
          bun run test:ts
          bun run compile:example
          cargo test --workspace
          cargo build -p rune-native --release

      - name: Pack materialized source
        run: |
          set -euo pipefail
          rm -rf .git .bootstrap
          rm -f .github/workflows/bootstrap.yml
          tar -czf /tmp/materialized-source.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: materialized-source
          path: /tmp/materialized-source.tar.gz
          if-no-files-found: error
          retention-days: 1
