name: Materialize Spellwire source tree

on:
  push:
    branches: ["feat/spellwire-rebrand"]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: spellwire-rebrand-materialize
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/spellwire-rebrand
          fetch-depth: 0

      - name: Expand and rebrand verified source tree
        run: |
          python3 .bootstrap/unpack.py
          sed -i 's/toBe("RUNE")/toBe("SPWR")/' packages/spellwire/test/encode.test.ts
          sed -i 's/\*b"RUNE"/\*b"SPWR"/' crates/spellwire-core/src/bytecode.rs
          sed -i 's#// RUNE#// SPWR#' packages/spellwire/src/compiler/encode.ts
          sed -i 's/RUNE bytecode/SPWR bytecode/g' docs/architecture.md
          sed -i "s/Rune's/Spellwire's/g" packaging/linux/99-spellwire-input.rules

      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify Spellwire workspace
        run: |
          set -euo pipefail
          bun install
          bun run typecheck
          bun run test:ts
          bun run compile:example
          cargo test --workspace
          cargo build -p spellwire-native --release
          bun run pack:dry-run

      - name: Commit clean source to the feature branch
        run: |
          set -euo pipefail
          rm -f .github/workflows/bootstrap.yml
          rm -f examples/*.spellwire.bin examples/*.spellwire.bin.json
          rm -rf packages/*/dist target node_modules packages/*/node_modules
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: rebrand runtime and packages to Spellwire"
          git push origin HEAD:feat/spellwire-rebrand
