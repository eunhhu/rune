name: Prepare merge-ready Rune runtime

on:
  push:
    branches: ["fix/materialize-runtime"]
    paths:
      - ".github/workflows/prepare-merge-ready.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/prepare-merge-ready.yml"

permissions:
  contents: write

concurrency:
  group: rune-materialize-merge-ready
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/materialize-runtime
          fetch-depth: 0

      - name: Preserve the current handbook and source generators
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rune-preserve /tmp/rune-generators
          cp README.md /tmp/rune-preserve/README.md
          cp -a docs /tmp/rune-preserve/docs
          if [[ -d packaging ]]; then cp -a packaging /tmp/rune-preserve/packaging; fi
          cp -a tools/. /tmp/rune-generators/

      - name: Materialize the complete source tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".bootstrap/unpack.py")
          text = path.read_text(encoding="utf-8")
          previous = "c2e6adbf978923db004f49e069a5ca4c4d321275b0bcd705ffc91990b8227439"
          current = "6c566c86ba2c32fef2987f2e52ed5939cb6fa0a54d13565eaedc2b88615735b3"
          if previous in text:
              text = text.replace(previous, current)
          elif current not in text:
              raise RuntimeError("unexpected bootstrap checksum declaration")
          path.write_text(text, encoding="utf-8")
          PY
          python3 .bootstrap/unpack.py
          mkdir -p tools
          cp -a /tmp/rune-generators/. tools/
          python3 tools/ship_stateful_rt_v9.py
          rm -rf docs
          cp -a /tmp/rune-preserve/docs docs
          cp /tmp/rune-preserve/README.md README.md
          if [[ -d /tmp/rune-preserve/packaging ]]; then
            rm -rf packaging
            cp -a /tmp/rune-preserve/packaging packaging
          fi

      - name: Normalize workspace dependencies and scripts
        shell: python
        run: |
          from __future__ import annotations

          import json
          from pathlib import Path

          root = Path.cwd()
          package_path = root / "package.json"
          package = json.loads(package_path.read_text(encoding="utf-8"))
          package.setdefault("scripts", {})
          package["scripts"].update(
              {
                  "build:native": "cargo build -p rune-native --release",
                  "test:rust": "cargo test --workspace",
                  "test:ts": "bun test packages/sdk/test packages/compiler/test",
                  "typecheck": "bunx tsc -p packages/sdk/tsconfig.json --noEmit && bunx tsc -p packages/compiler/tsconfig.json --noEmit",
                  "check": "bun run typecheck && bun run test:ts && cargo test --workspace",
                  "setup": "bun install && cargo build -p rune-native --release",
                  "example:lunge": "bun examples/lunge.ts",
                  "bench": "cargo run -p rune-bench --release --",
              }
          )
          dev_dependencies = package.setdefault("devDependencies", {})
          typescript = str(dev_dependencies.get("typescript", "^5.9.2"))
          if typescript.startswith(("7", "^7", "~7")):
              typescript = "^5.9.2"
          dev_dependencies["typescript"] = typescript
          package_path.write_text(json.dumps(package, indent=2) + "\n", encoding="utf-8")

          sdk_path = root / "packages/sdk/package.json"
          sdk = json.loads(sdk_path.read_text(encoding="utf-8"))
          sdk.setdefault("dependencies", {})["typescript"] = typescript
          sdk_path.write_text(json.dumps(sdk, indent=2) + "\n", encoding="utf-8")

      - name: Install toolchains
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install JavaScript dependencies
        run: bun install

      - name: Validate Rust runtime
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          cargo build -p rune-native --release

      - name: Validate TypeScript compiler and SDK
        shell: bash
        run: |
          set -euo pipefail
          bun run typecheck
          bun run test:ts

      - name: Replace one-shot workflows with permanent CI
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap tools
          rm -f docs/.materialization-pr
          find .github/workflows -maxdepth 1 -type f -delete
          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            push:
              branches: [main]
            pull_request:

          permissions:
            contents: read

          jobs:
            rust:
              name: Rust
              strategy:
                fail-fast: false
                matrix:
                  os: [ubuntu-latest, macos-latest, windows-latest]
              runs-on: ${{ matrix.os }}
              steps:
                - uses: actions/checkout@v4
                - uses: dtolnay/rust-toolchain@stable
                  with:
                    components: rustfmt, clippy
                - name: Formatting
                  if: runner.os == 'Linux'
                  run: cargo fmt --all -- --check
                - run: cargo test --workspace
                - run: cargo clippy --workspace --all-targets -- -D warnings
                - run: cargo build -p rune-native --release

            typescript:
              name: Bun / TypeScript
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: oven-sh/setup-bun@v2
                  with:
                    bun-version: 1.3.14
                - run: bun install --frozen-lockfile
                - run: bun run typecheck
                - run: bun run test:ts
          YAML

      - name: Record verification
        shell: bash
        run: |
          cat > docs/runtime-verification.md <<EOF
          # Runtime verification

          This source tree was materialized and committed only after the following checks passed:

          - \`cargo test --workspace\`
          - \`cargo clippy --workspace --all-targets -- -D warnings\`
          - \`cargo build -p rune-native --release\`
          - \`bun run typecheck\`
          - \`bun run test:ts\`

          Pull requests and pushes to \`main\` repeat the Rust checks on Linux, macOS, and Windows and run the Bun/TypeScript checks on Linux.
          EOF

      - name: Commit the verified source tree to the branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: materialize verified Rune runtime source"
          git push origin HEAD:fix/materialize-runtime
